name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shejane-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Resolve immutable release identity
        id: release
        shell: bash
        run: |
          short_sha=${DEPLOY_SHA:0:8}
          release_id="$(date -u +'%Y%m%dT%H%M%SZ')-$short_sha"
          version="shejane-beta-$(date -u +'%Y%m%d').${GITHUB_RUN_NUMBER}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux release binary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOWORK=off GOEXPERIMENT=greenteagc \
            go build \
              -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" \
              -o new-api .
          bash -n .github/scripts/deploy-production.sh
          echo "artifact_sha=$(sha256sum new-api | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "script_sha=$(sha256sum .github/scripts/deploy-production.sh | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shejane-cloud-${{ github.run_id }}

      - name: Upload immutable deployment artifacts
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          prefix="releases/$RELEASE_ID"
          aws s3 cp new-api "s3://$ARTIFACT_BUCKET/$prefix/new-api" \
            --sse AES256 \
            --only-show-errors \
            --metadata "sha256=$artifact_sha,commit=$DEPLOY_SHA,version=$VERSION"
          aws s3 cp .github/scripts/deploy-production.sh \
            "s3://$ARTIFACT_BUCKET/$prefix/deploy-production.sh" \
            --sse AES256 \
            --only-show-errors \
            --metadata "sha256=$script_sha,commit=$DEPLOY_SHA"

      - name: Deploy through SSM
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          script_key="releases/$RELEASE_ID/deploy-production.sh"
          binary_key="releases/$RELEASE_ID/new-api"
          remote_script="/tmp/shejane-cloud-deploy-${DEPLOY_SHA:0:8}.sh"
          printf -v remote_command \
            'aws s3 cp %q %q --region us-east-1 --only-show-errors && test "$(sha256sum %q | cut -d" " -f1)" = %q && chmod 0700 %q && %q %q %q %q %q %q' \
            "s3://$ARTIFACT_BUCKET/$script_key" \
            "$remote_script" \
            "$remote_script" \
            "$script_sha" \
            "$remote_script" \
            "$remote_script" \
            "$RELEASE_ID" \
            "$VERSION" \
            "$ARTIFACT_BUCKET" \
            "$binary_key" \
            "$artifact_sha"
          jq -n --arg command "$remote_command" '{commands: [$command]}' > ssm-parameters.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions ${GITHUB_RUN_ID} ${DEPLOY_SHA:0:8}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" > ssm-result.json
          jq -r '.StandardOutputContent' ssm-result.json
          status=$(jq -r '.Status' ssm-result.json)
          if [[ $status != Success ]]; then
            jq -r '.StandardErrorContent' ssm-result.json >&2
            exit 1
          fi

      - name: Verify public release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for _ in {1..15}; do
            actual=$(curl -fsS --max-time 5 https://app.shejane.com/api/status 2>/dev/null \
              | jq -r '.data.version // empty' || true)
            [[ $actual == "$VERSION" ]] && exit 0
            sleep 2
          done
          echo "public release did not reach $VERSION" >&2
          exit 1
